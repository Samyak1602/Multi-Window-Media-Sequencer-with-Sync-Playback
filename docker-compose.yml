services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: media-sequencer-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/sequencer.db
      - FRONTEND_ORIGIN=*
      - DEFAULT_SYNC_DURATION_SECONDS=10
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

volumes:
  sqlite_data:
